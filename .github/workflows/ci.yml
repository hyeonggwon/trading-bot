name: CI

# 전 게이트 차단(blocking): pytest(+커버리지 플로어 60%)·ruff check·
# ruff format. mypy 는 baseline 래칫 — 오류 수가 .mypy-baseline 을 넘으면
# 실패한다(감소는 언제나 허용; 부채를 줄이면 .mypy-baseline 도 함께 내려
# 그 수준을 새 바닥으로 고정). ruff 부채는 0 으로 정리 완료(2026-07).
#
# Python 은 constraints.txt 를 freeze 한 개발 venv 와 동일한 3.12 — 핀 중
# scipy>=1.18 등이 3.12 전용이라 3.11 러너에서는 해석 불가능(ResolutionImpossible).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install OpenMP runtime (LightGBM)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - name: Install package
        # dev extra 가 ml 을 포함하고 constraints 가 버전을 고정 — README 설치
        # 절차와 동일한 커맨드를 CI 가 그대로 검증한다.
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run tests (coverage floor 60%)
        run: pytest tests/ -q --cov=src/tradingbot --cov-fail-under=60

  lint:
    name: lint & types (blocking + mypy ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install OpenMP runtime (LightGBM)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - name: Install package
        run: pip install -e ".[dev]" -c constraints.txt
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format --check
        run: ruff format --check src/ tests/
      - name: mypy (ratchet — count must not exceed .mypy-baseline)
        run: |
          # mypy 정상 종료코드는 0(클린)/1(오류 발견). 그 외는 크래시로 간주해
          # 실패시킨다 — grep 이 0 을 세어 게이트가 조용히 초록이 되는 것을 방지.
          status=0
          out=$(mypy src/ 2>&1) || status=$?
          if [ "${status}" -gt 1 ]; then
            echo "::error::mypy crashed (exit ${status})"
            printf '%s\n' "${out}" | tail -20
            exit 1
          fi
          count=$(printf '%s\n' "${out}" | grep -c ' error: ' || true)
          baseline=$(cat .mypy-baseline)
          echo "mypy errors: ${count} (baseline: ${baseline})"
          if [ "${count}" -gt "${baseline}" ]; then
            echo "::error::mypy error count ${count} exceeds baseline ${baseline}"
            printf '%s\n' "${out}" | grep ' error: '
            exit 1
          fi
