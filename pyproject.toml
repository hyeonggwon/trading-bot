[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Algorithmic trading bot for Upbit with backtesting framework"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "ta>=0.11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # 0.16 미만은 click>=8.2 와 비호환("Secondary flag is not valid...")으로
    # 콘솔 스크립트 조립이 깨진다 — 테스트는 커맨드 함수를 직접 불러 못 잡는다.
    "typer>=0.16",
    "pyarrow>=14.0",
    "structlog>=23.0",
    "rich>=13.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
    # 테스트 스위트가 실제 LightGBM fit 을 전제하므로(tests/CLAUDE.md) ml 포함
    "trading-bot[ml]",
    # mypy 대상(src/tradingbot/dashboard)과 AppTest 테스트가 streamlit 을
    # import 하므로 dashboard 도 포함 — 없으면 CI mypy 오류 수가 로컬과 어긋난다.
    "trading-bot[dashboard]",
    # pandas 는 실스텁으로 검사한다(오버라이드 목록에서 제외됨) — 스텁이
    # 빠지면 import-untyped 로 CI 가 빨갛게 되는 것이 의도.
    "pandas-stubs>=2.0",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.0",
]
ml = [
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "optuna>=3.5.0",
]

[project.scripts]
tradingbot = "tradingbot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingbot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # (str, Enum) → StrEnum 마이그레이션은 str()/f-string 출력 의미가 바뀐다
    # (멤버명 → 값). 로그·알림·직렬화에 스며든 현행 의미 보존을 택한다.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# sklearn 관례(X, y, X_train, X_cal …)를 따르는 ML 코드와 그 테스트
"src/tradingbot/ml/*" = ["N803", "N806"]
"src/tradingbot/strategy/lgbm_strategy.py" = ["N806"]
"src/tradingbot/strategy/filters/ml.py" = ["N806"]
"tests/test_ml.py" = ["N803", "N806"]
"tests/test_threshold_tuner.py" = ["N806"]
"tests/test_combine.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# 스텁 없는 서드파티: import 를 Any 로 취급(사실상 현행 동작 그대로)해
# import-untyped 노이즈만 제거. pandas-stubs 등 실제 스텁 도입은 오류
# 표면을 크게 바꾸므로 별도 유닛에서 검토한다.
module = [
    "ccxt",
    "ccxt.*",
    "ta",
    "ta.*",
    "yaml",
    "sklearn.*",
    "scipy.*",
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true
